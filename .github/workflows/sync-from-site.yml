name: Sync skills from jobspipe.dev

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-from-site
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Pull the published skills
        env:
          REPORT: ${{ runner.temp }}/report.md
        run: bash .github/scripts/sync-from-site.sh && cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"

      - name: Push a branch and open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ runner.temp }}/report.md
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard skills README.md)" ]; then
            echo "Nothing changed: the repo matches jobspipe.dev." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "jobspipe-skills-sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B sync-from-site
          git add skills README.md
          git commit -m "Sync skills from jobspipe.dev" -m "$(cat "$REPORT")"
          git push --force origin sync-from-site
          if gh pr list --head sync-from-site --state open --json number --jq '.[0].number' | grep -q .; then
            echo "Updated the open sync pull request." >> "$GITHUB_STEP_SUMMARY"
          elif gh pr create --head sync-from-site --base main --title "Sync skills from jobspipe.dev" --body-file "$REPORT"; then
            echo "Opened a sync pull request." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Pushed branch sync-from-site. Actions may not open pull requests here yet: open it from the branch." >> "$GITHUB_STEP_SUMMARY"
          fi
